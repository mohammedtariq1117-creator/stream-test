<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TikTok</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#000; color:#fff; font-family:-apple-system,Roboto,sans-serif; height:100vh; overflow:hidden; }
  .stage { position:relative; width:100%; height:100%; }
  .thumb { position:absolute; inset:0; background:#111 center/cover no-repeat; filter:brightness(.55); }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:18px; background:rgba(0,0,0,.35); }
  .logo { width:64px; height:64px; border-radius:50%; background:#000; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 3px #fff inset; }
  .logo svg { width:38px; height:38px; }
  .play { width:88px; height:88px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .15s; }
  .play:active { transform:scale(.92); }
  .play svg { width:36px; height:36px; margin-left:5px; }
  .meta { position:absolute; left:14px; bottom:20px; right:80px; }
  .meta .u { font-weight:700; font-size:15px; }
  .meta .c { font-size:13px; opacity:.85; margin-top:4px; line-height:1.35; }
  .bar { position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.25); }
  .bar > i { display:block; height:100%; width:0; background:#fe2c55; transition:width .3s linear; }
  .err { position:absolute; top:16px; left:16px; right:16px; padding:10px 14px; background:rgba(254,44,85,.92); border-radius:10px; font-size:13px; display:none; }
</style>
</head>
<body>
<div class="stage">
  <div class="thumb" id="thumb"></div>
  <div class="overlay">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M16.5 3c.4 2.1 1.9 3.6 4 4v3.2c-1.5.1-2.9-.3-4-1v6.9c0 3.4-2.7 6.1-6.1 6.1S4.3 19.5 4.3 16.1c0-3.2 2.5-5.9 5.7-6.1v3.2c-1.4.2-2.5 1.4-2.5 2.9 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9V3h3.2z" fill="#fff"/></svg>
    </div>
    <div class="play" id="play">
      <svg viewBox="0 0 24 24" fill="#000"><path d="M8 5v14l11-7z"/></svg>
    </div>
  </div>
  <div class="meta">
    <div class="u">@user849201</div>
    <div class="c">original sound · loading video…</div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="err" id="err"></div>
</div>
<script src="app.js"></script>
</body>
</html>
